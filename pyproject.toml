[project]
name = "sqlite-explorer-mcp"
version = "0.1.1"
description = "Read-only MCP server for exploring a SQLite database"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3"]

[project.scripts]
sqlite-explorer-mcp = "sqlite_explorer.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlite_explorer"]